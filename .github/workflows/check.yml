name: Check rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12.14"
      - run: pip install -r requirements.txt
      - name: Every rule is valid and compiles
        run: python scripts/check_rules.py
      - name: The SigmaHQ files are what the pinned commit holds
        run: python scripts/sync_sigmahq.py --check

  test:
    # Each rule with a file in tests/ runs on its sample events in a real Elasticsearch, the version Opsis runs.
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: elasticsearch:8.13.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12.14"
      - run: pip install -r requirements.txt
      - name: Rules do what their sample logs say
        run: python scripts/test_rules.py --es http://localhost:9200
