name: Tag a release

# Every change merged into main gets a tag once its checks and tests pass, so the Opsis Detection rules page ("Pull from git") and
# rules-update.sh always have a tag to switch to. Tags are vYYYY.MM.DD or, for the second and later ones of a day, vYYYY.MM.DD.N.

on:
  workflow_run:
    workflows: ["Check rules"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tag the commit unless it already has a tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$(git tag --points-at "$SHA")" ]; then echo "already tagged: $(git tag --points-at "$SHA")"; exit 0; fi
          day="v$(date -u +%Y.%m.%d)"
          tag="$day"; n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do n=$((n + 1)); tag="$day.$n"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Rules at $SHA (checks and tests passed)" "$SHA"
          git push origin "$tag"
          echo "tagged $SHA as $tag"
