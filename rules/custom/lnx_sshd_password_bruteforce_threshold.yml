title: SSH Brute Force - Many Failed Logins From One Source (Linux)
id: b35c042b-fe98-4638-8cfa-99f3744b4f90
status: experimental
description: |
    Five or more failed SSH password attempts from one source address within five minutes on one host.
    Written for this project, not a SigmaHQ rule. It reads the ECS fields the Opsis ingest pipeline "soc-linux" sets on /var/log/secure
    lines shipped by Filebeat (event.action ssh_login, event.outcome failure|success, user.name, source.ip) into logs-linux-*.
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: SOC lab
date: 2026/11/27
tags:
    - attack.credential_access
    - attack.t1110.001
logsource:
    product: linux
    service: sshd
detection:
    selection:
        event.action: ssh_login
        event.outcome: failure
    condition: selection
falsepositives:
    - A user or a script retrying an old password from one machine
    - Vulnerability scanners run by the organisation
level: high
soc_threshold:
    count: 5
    window_seconds: 300
    group_by:
        - source.ip
