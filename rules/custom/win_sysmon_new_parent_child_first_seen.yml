# NOT a SigmaHQ rule. Written for the Agentic SOC project (D66). The numbers in soc_pattern are project defaults, not measured ones.
title: Process Started By A Parent It Has Never Had Before (SOC pattern rule)
id: 3f6c1d52-8a0e-4c41-9a53-5b2f7e1d0a03
status: experimental
description: A process-creation event (Sysmon 1) whose parent image and image pair did not appear in the logs of the last 14 days. It stays quiet until those logs go back at least 7 days, so a lab that replays datasets a few minutes apart never alerts with it.
author: Agentic SOC project
date: 2026-10-30
tags:
    - attack.execution
    - attack.t1059
logsource:
    product: windows
    service: sysmon
detection:
    selection:
        EventID: 1
    condition: selection
falsepositives:
    - A new program, or a program updated to a new path
level: low
signal: true
soc_pattern:
    kind: first_seen
    entity: [parent_image, image]
    baseline_days: 14
    min_baseline_events: 1000
    min_baseline_age_days: 7
