# NOT a SigmaHQ rule. Written for the Agentic SOC project (D66). The numbers in soc_pattern are project defaults, not measured ones.
title: Password Spray - Many Different Accounts From One Source (SOC pattern rule)
id: 3f6c1d52-8a0e-4c41-9a53-5b2f7e1d0a01
status: experimental
description: Failed Windows logons (Security 4625) for five or more different accounts from one source address within five minutes, the shape of password spraying rather than of guessing one account.
author: Agentic SOC project
date: 2026-10-30
tags:
    - attack.credential_access
    - attack.t1110.003
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    condition: selection
falsepositives:
    - A scanner or a service account list tried from one management host
level: medium
soc_pattern:
    kind: distinct
    window_seconds: 300
    group_by: [source_ip]
    field: user
    count: 5
