rule: custom/lnx_sshd_password_bruteforce_threshold.yml
source: >-
  Real /var/log/secure lines of a lab RHEL 9 host as the Opsis "soc-linux" pipeline stores them (27/11/2026). Host name, addresses and
  key fingerprint are replaced with documentation values (198.51.100.0/24, 203.0.113.0/24).
cases:
  - name: six failed passwords from one address within a minute
    expect: alert
    repeat: {count: 6, every_seconds: 10}
    events:
      - {"@timestamp": "2026-11-27T03:14:00Z", "host": {"name": "linux-lab01"}, "source": {"ip": "198.51.100.23"}, "user": {"name": "admin"},
         "event": {"action": "ssh_login", "category": "authentication", "outcome": "failure"},
         "message": "Nov 27 10:13:58 linux-lab01 sshd-session[236551]: Failed password for invalid user admin from 198.51.100.23 port 54878 ssh2"}
  - name: four failed passwords stay under the threshold
    expect: no_alert
    repeat: {count: 4, every_seconds: 10}
    events:
      - {"@timestamp": "2026-11-27T03:14:00Z", "host": {"name": "linux-lab01"}, "source": {"ip": "198.51.100.23"}, "user": {"name": "admin"},
         "event": {"action": "ssh_login", "category": "authentication", "outcome": "failure"},
         "message": "Nov 27 10:13:58 linux-lab01 sshd-session[236551]: Failed password for invalid user admin from 198.51.100.23 port 54878 ssh2"}
  - name: six failures spread over ten minutes never reach five in one window
    expect: no_alert
    repeat: {count: 6, every_seconds: 120}
    events:
      - {"@timestamp": "2026-11-27T03:14:00Z", "host": {"name": "linux-lab01"}, "source": {"ip": "198.51.100.23"}, "user": {"name": "admin"},
         "event": {"action": "ssh_login", "category": "authentication", "outcome": "failure"},
         "message": "Nov 27 10:13:58 linux-lab01 sshd-session[236551]: Failed password for invalid user admin from 198.51.100.23 port 54878 ssh2"}
  - name: six failures from six different addresses are not this rule (one source each)
    expect: no_alert
    events:
      - {"@timestamp": "2026-11-27T03:14:00Z", "host": {"name": "linux-lab01"}, "source": {"ip": "203.0.113.1"}, "user": {"name": "admin"}, "event": {"action": "ssh_login", "outcome": "failure"}}
      - {"@timestamp": "2026-11-27T03:14:05Z", "host": {"name": "linux-lab01"}, "source": {"ip": "203.0.113.2"}, "user": {"name": "admin"}, "event": {"action": "ssh_login", "outcome": "failure"}}
      - {"@timestamp": "2026-11-27T03:14:10Z", "host": {"name": "linux-lab01"}, "source": {"ip": "203.0.113.3"}, "user": {"name": "admin"}, "event": {"action": "ssh_login", "outcome": "failure"}}
      - {"@timestamp": "2026-11-27T03:14:15Z", "host": {"name": "linux-lab01"}, "source": {"ip": "203.0.113.4"}, "user": {"name": "admin"}, "event": {"action": "ssh_login", "outcome": "failure"}}
      - {"@timestamp": "2026-11-27T03:14:20Z", "host": {"name": "linux-lab01"}, "source": {"ip": "203.0.113.5"}, "user": {"name": "admin"}, "event": {"action": "ssh_login", "outcome": "failure"}}
      - {"@timestamp": "2026-11-27T03:14:25Z", "host": {"name": "linux-lab01"}, "source": {"ip": "203.0.113.6"}, "user": {"name": "admin"}, "event": {"action": "ssh_login", "outcome": "failure"}}
  - name: six accepted logins are not failures
    expect: no_alert
    repeat: {count: 6, every_seconds: 10}
    events:
      - {"@timestamp": "2026-11-27T09:07:21Z", "host": {"name": "linux-lab01"}, "source": {"ip": "198.51.100.10"}, "user": {"name": "root"},
         "auth": {"method": "publickey"}, "event": {"action": "ssh_login", "category": "authentication", "outcome": "success"},
         "message": "Nov 27 16:07:19 linux-lab01 sshd-session[256811]: Accepted publickey for root from 198.51.100.10 port 44218 ssh2: ED25519 SHA256:EXAMPLE"}
